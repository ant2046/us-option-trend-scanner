name: Premarket trend scan

on:
  schedule:
    - cron: "30 8 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      replay:
        type: boolean
        description: "Replay the latest 20 completed sessions"
        default: false

concurrency:
  group: premarket-trend-scan-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Validation dry run
        if: inputs.replay != true
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m market_scanner.main --dry-run --archive-json scan-results/scan.json
      - name: Historical dry run
        if: github.event_name == 'workflow_dispatch' && inputs.replay == true
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m market_scanner.replay --output scan-results/replay
      - name: Archive scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: scan-results/
          if-no-files-found: error
          retention-days: 90

