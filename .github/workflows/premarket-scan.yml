name: Premarket trend scan

on:
  schedule:
    - cron: "30 8 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      send:
        description: "Send the report to enterprise WeChat"
        required: false
        type: boolean
        default: false

concurrency:
  group: premarket-trend-scan-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Scheduled or explicitly requested send
        if: github.event_name == 'schedule' || inputs.send == true
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m market_scanner.main --send
      - name: Manual dry run
        if: github.event_name == 'workflow_dispatch' && inputs.send != true
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python -m market_scanner.main --dry-run
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import exchange_calendars as xcals
          import pandas as pd

          from market_scanner.config import Settings
          from market_scanner.massive import MassiveClient
          from market_scanner.massive_data import MassiveMarketData

          settings = Settings.from_env(require_webhook=False)
          if not settings.massive_api_key:
              raise SystemExit("Missing MASSIVE_API_KEY")
          ny = ZoneInfo("America/New_York")
          today = datetime.now(ny).date()
          session = xcals.get_calendar("XNYS").date_to_session(pd.Timestamp(today), direction="previous")
          bars = MassiveMarketData(MassiveClient(settings.massive_api_key)).daily_history(
              "SPY", datetime.combine(session.date(), datetime.min.time(), ny)
          )
          print(f"Verified source=massive symbol=SPY daily_bars={len(bars)} latest_session={bars.index[-1].date()}")
          PY

