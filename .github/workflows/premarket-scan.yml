name: Premarket trend scan

on:
  schedule:
    - cron: "30 8 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      send:
        description: "Send the report to enterprise WeChat"
        required: false
        type: boolean
        default: false

concurrency:
  group: premarket-trend-scan-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Scheduled or explicitly requested send
        if: github.event_name == 'schedule' || inputs.send == true
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python -m market_scanner.main --send
      - name: Manual dry run
        if: github.event_name == 'workflow_dispatch' && inputs.send != true
        run: python -m market_scanner.main --dry-run

