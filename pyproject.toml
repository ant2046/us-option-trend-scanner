[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "us-option-trend-scanner"
version = "0.1.0"
description = "Premarket trend scanner for a fixed US equity watchlist"
requires-python = ">=3.11"
dependencies = [
  "exchange-calendars>=4.11,<5",
  "pandas>=2.2,<4",
  "Pillow>=11,<13",
  "requests>=2.32,<3",
  "yfinance>=0.2.66,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

